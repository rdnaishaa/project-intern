<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verifikasi Dokumen</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-5 text-slate-800 md:p-10">
<div id="app" class="mx-auto max-w-3xl"></div>
<script>
const token=location.pathname.split('/').pop();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=x=>x?new Date(x).toLocaleString('id-ID'):'-';
async function run(){
  const response=await fetch('/api/verify/'+encodeURIComponent(token));
  const d=await response.json(); const app=document.querySelector('#app');
  if(!response.ok){app.innerHTML='<div class="rounded-2xl border bg-white p-8 text-center shadow-sm"><div class="text-5xl">✕</div><h1 class="mt-3 text-xl font-extrabold">Dokumen Tidak Ditemukan</h1><p class="mt-2 text-sm text-slate-500">'+esc(d.message)+'</p></div>';return;}
  const current=d.approvals.find(a=>a.status==='ACTIVE');
  const approvalId=new URLSearchParams(location.search).get('approval');
  const auth=approvalId?await (await fetch('/api/approval-auth/'+encodeURIComponent(approvalId))).json():{allowed:false};
  const action=auth.allowed&&current&&current.id===approvalId?'<div class="mt-6 rounded-xl border border-blue-200 bg-blue-50 p-4"><b>Tindakan '+esc(current.stage||'APPROVAL')+': '+esc(current.approverName)+'</b><label class="mt-4 block text-sm font-bold">Tanda Tangan</label><canvas id="sig" width="700" height="180" class="mt-2 h-36 w-full touch-none rounded-xl border-2 border-dashed bg-white"></canvas><button id="clear" type="button" class="mt-2 text-xs font-bold text-red-600">Hapus & Gambar Ulang</button><label class="mt-4 block text-sm font-bold">Catatan</label><textarea id="comment" class="mt-2 min-h-24 w-full rounded-xl border px-3 py-2" placeholder="Wajib untuk Reject"></textarea><div class="mt-4 grid grid-cols-2 gap-2"><button id="reject" class="rounded-xl bg-red-600 px-4 py-2.5 font-bold text-white">Reject</button><button id="approve" class="rounded-xl bg-[#1261A0] px-4 py-2.5 font-bold text-white">Approve</button></div></div>':(current?'<div class="mt-6 rounded-xl border border-blue-200 bg-blue-50 p-4"><b>Giliran '+esc(current.stage||'APPROVAL')+': '+esc(current.approverName)+'</b><p class="mt-1 text-sm text-slate-600">Approve atau Reject memerlukan Microsoft Login.</p><a href="/auth/microsoft/start?approvalId='+encodeURIComponent(current.id||'')+'" class="mt-3 inline-block rounded-xl bg-[#1261A0] px-4 py-2.5 text-sm font-bold text-white">Microsoft Login</a></div>':'');
  app.innerHTML='<div class="mb-6 text-center"><div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-emerald-600 text-white text-2xl">✓</div><h1 class="mt-4 text-2xl font-extrabold">Public Document Verification</h1><p class="text-sm text-slate-500">Progress approval dapat dilihat tanpa login.</p></div>'+
  '<div class="overflow-hidden rounded-2xl border bg-white shadow-sm"><div class="border-b p-5"><div class="text-xs font-bold text-slate-400">'+esc(d.submissionNo)+'</div><h2 class="mt-1 text-xl font-bold">'+esc(d.title)+'</h2><span class="mt-3 inline-block rounded-full '+(d.status==='APPROVED'?'bg-emerald-50 text-emerald-700':d.status==='REJECTED'?'bg-red-50 text-red-700':'bg-amber-50 text-amber-700')+' px-3 py-1 text-xs font-bold">'+esc(d.status==='IN_APPROVAL'?'IN APPROVAL':d.status==='APPROVED'?'APPROVED / VERIFIED':d.status)+'</span></div>'+
  '<div class="p-5"><div class="grid gap-4 text-sm sm:grid-cols-2"><div><div class="text-xs text-slate-400">Pemohon</div><b>'+esc(d.applicantName)+'</b></div><div><div class="text-xs text-slate-400">Departemen</div><b>'+esc(d.department)+'</b></div><div><div class="text-xs text-slate-400">Tanggal Pengajuan</div><b>'+fmt(d.submittedAt)+'</b></div><div><div class="text-xs text-slate-400">Progress</div><b>'+d.progress.completed+'/'+d.progress.total+' approval selesai</b></div></div><a target="_blank" href="'+esc(d.filePath)+'" class="mt-5 inline-block rounded-xl border px-4 py-2.5 text-sm font-bold">Lihat / Download Dokumen</a>'+
  action+
  '<h3 class="mt-7 font-bold">Approval History</h3><div class="mt-4 space-y-3">'+d.approvals.map(a=>'<div class="flex items-center gap-3 rounded-xl border p-3"><div class="grid h-9 w-9 shrink-0 place-items-center rounded-full '+(a.status==='APPROVED'?'bg-emerald-50 text-emerald-700':a.status==='ACTIVE'?'bg-blue-50 text-blue-700':'bg-slate-100 text-slate-500')+'">'+(a.status==='APPROVED'?'✓':a.status==='ACTIVE'?'●':a.order)+'</div><div class="flex-1"><b>'+esc(a.approverName||'-')+'</b><div class="text-xs text-slate-500">'+esc(a.stage||'APPROVER')+' · '+esc(a.position||'-')+' · '+esc(a.area||'-')+'</div></div><div class="text-right text-xs text-slate-400">'+esc(a.status)+'<br>'+fmt(a.approvedAt)+'</div></div>').join('')+'</div></div></div>';
}
run().then(()=>{
  const canvas=document.querySelector('#sig'); if(!canvas)return;
  const ctx=canvas.getContext('2d'); let drawing=false; ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#172033'; const emptySignature=canvas.toDataURL('image/png');
  const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  canvas.onpointerdown=e=>{drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
  canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()}; window.onpointerup=()=>drawing=false;
  document.querySelector('#clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
  document.querySelector('#approve').onclick=()=>submit('APPROVE'); document.querySelector('#reject').onclick=()=>submit('REJECT');
  async function submit(action){const signature=canvas.toDataURL('image/png'),comment=document.querySelector('#comment').value;if(action==='REJECT'&&!comment.trim())return alert('Catatan wajib diisi saat Reject.');if(action==='APPROVE'&&signature===emptySignature)return alert('Tanda tangan wajib diisi.');try{const r=await fetch('/api/approvals/'+encodeURIComponent(new URLSearchParams(location.search).get('approval'))+'/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,comment,signatureData:action==='APPROVE'?signature:''})});const data=await r.json();if(!r.ok)throw Error(data.message);location.href='/verify/'+token;}catch(error){alert(error.message)}}
});
</script>
</body>
</html>
