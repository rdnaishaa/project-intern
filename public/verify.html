<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verifikasi Dokumen</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-50 p-5 md:p-10 text-slate-800"><div id="app" class="mx-auto max-w-2xl"></div><script>
const token=location.pathname.split('/').pop();
async function run(){let r=await fetch('/api/verify/'+token);let d=await r.json();let app=document.querySelector('#app');if(!r.ok){app.innerHTML='<div class="rounded-2xl border bg-white p-8 text-center shadow-sm"><div class="text-5xl">✕</div><h1 class="mt-3 text-xl font-extrabold">QR Tidak Valid</h1><p class="mt-2 text-sm text-slate-500">'+(d.message||'Dokumen tidak ditemukan')+'</p></div>';return}app.innerHTML='<div class="text-center mb-6"><div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-emerald-600 text-white text-2xl">✓</div><h1 class="mt-4 text-2xl font-extrabold">Dokumen Terverifikasi</h1><p class="text-sm text-slate-500">Evidence approval transmittal</p></div><div class="overflow-hidden rounded-2xl border bg-white shadow-sm"><div class="border-b p-5"><div class="text-xs font-bold text-slate-400">'+d.submissionNo+'</div><h2 class="mt-1 text-xl font-bold">'+d.title+'</h2><span class="mt-3 inline-block rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700">'+d.status+'</span></div><div class="p-5"><div class="grid gap-4 sm:grid-cols-2"><div><div class="text-xs text-slate-400">Pemohon</div><b>'+d.applicantName+'</b></div><div><div class="text-xs text-slate-400">Tanggal Approval</div><b>'+new Date(d.approvedAt).toLocaleString('id-ID')+'</b></div></div><h3 class="mt-7 font-bold">Approval Evidence</h3><div class="mt-4 space-y-3">'+d.approvals.map(a=>'<div class="flex items-center gap-3 rounded-xl border p-3"><div class="grid h-9 w-9 place-items-center rounded-full bg-emerald-50 text-emerald-700">✓</div><div class="flex-1"><b>'+a.approverName+'</b><div class="text-xs text-slate-500">'+a.position+' · '+a.area+'</div></div><div class="text-right text-xs text-slate-400">'+new Date(a.approvedAt).toLocaleString('id-ID')+'</div></div>').join('')+'</div></div></div>'}
run();</script></body></html>
