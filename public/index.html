<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>HRBP Transmittal Approval</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:'#1261A0'}}}}</script>
</head>
<body class="bg-slate-50 text-slate-800">
<div id="app"></div>
<script>
const API='/api'; let state={user:null,page:'dashboard',detail:null,creating:false,users:[]};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){let r=await fetch(API+url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request gagal');return d}
function badge(s){let c={APPROVED:'bg-emerald-50 text-emerald-700',IN_APPROVAL:'bg-amber-50 text-amber-700',WAITING:'bg-amber-50 text-amber-700',REJECTED:'bg-red-50 text-red-700'}[s]||'bg-slate-100 text-slate-600';return `<span class="rounded-full px-2.5 py-1 text-xs font-bold ${c}">${s==='IN_APPROVAL'?'Waiting Approval':s}</span>`}
function fmt(x){return x?new Date(x).toLocaleString('id-ID'):'-'}
async function init(){state.users=await api('/users');render()}
function login(){let opts=state.users.map(u=>`<option value="${u.id}">${esc(u.name)} — ${esc(u.position)}</option>`).join('');document.querySelector('#app').innerHTML=`<div class="min-h-screen grid place-items-center bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 p-5"><div class="w-full max-w-md"><div class="text-center mb-6"><div class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-brand text-white text-2xl">✓</div><h1 class="mt-4 text-2xl font-extrabold">HRBP Transmittal Approval</h1><p class="text-sm text-slate-500">Local prototype</p></div><div class="rounded-2xl border bg-white p-6 shadow-sm"><label class="mb-2 block text-sm font-bold">Login sebagai</label><select id="loginUser" class="w-full rounded-xl border px-3 py-2.5"><option value="">Pilih user...</option>${opts}</select><button onclick="doLogin()" class="mt-4 w-full rounded-xl bg-brand px-4 py-3 font-bold text-white">Masuk</button><div class="mt-4 rounded-xl bg-blue-50 p-3 text-xs leading-5 text-blue-800">Demo: Faisal membuat pengajuan → Budi → Andi → Sari melakukan approval.</div></div></div></div>`}
function doLogin(){let u=state.users.find(x=>x.id==$('#loginUser').value);if(!u)return alert('Pilih user');state.user=u;localStorage.demoUser=JSON.stringify(u);state.page='dashboard';render()}
function logout(){localStorage.removeItem('demoUser');state.user=null;login()}
function layout(content){return `<aside class="fixed inset-y-0 left-0 hidden w-64 border-r bg-white p-4 md:block"><div class="flex items-center gap-3 p-2"><div class="grid h-10 w-10 place-items-center rounded-xl bg-brand text-white">✓</div><div><b>HRBP Transmittal</b><div class="text-xs text-slate-500">Approval System</div></div></div><nav class="mt-7 space-y-1">${nav('dashboard','Dashboard')}${nav('requests','Pengajuan')}${nav('approvals','Approval Saya')}${nav('notifications','Notifikasi')}${(state.user.role==='ADMIN'||state.user.role==='VIEWER')?nav('monitoring','Monitoring'):''}</nav><div class="absolute bottom-4 left-4 right-4 rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">Login sebagai</div><b class="text-sm">${esc(state.user.name)}</b><div class="mt-1 text-xs">${esc(state.user.position)}</div></div></aside><main class="md:ml-64"><header class="sticky top-0 z-10 flex h-16 items-center justify-end border-b bg-white/90 px-5 backdrop-blur"><button onclick="logout()" class="rounded-xl border px-3 py-2 text-sm font-bold">Logout</button></header><section class="p-4 md:p-7">${content}</section></main>`}
function nav(k,l){return `<button onclick="go('${k}')" class="w-full rounded-xl px-3 py-2.5 text-left text-sm font-bold ${state.page===k?'bg-blue-50 text-brand':'text-slate-600 hover:bg-slate-50'}">${l}</button>`}
async function render(){if(!state.user){login();return}if(state.page==='detail')return renderDetail();if(state.page==='create')return renderCreate();let content='';if(state.page==='dashboard')content=await dashboard();if(state.page==='requests')content=await requests();if(state.page==='approvals')content=await approvals();if(state.page==='notifications')content=await notifications();if(state.page==='monitoring')content=await monitoring();$('#app').innerHTML=layout(content)}
async function dashboard(){let d=await api('/dashboard/'+state.user.id);return `<div class="mb-7"><h1 class="text-2xl font-extrabold">Dashboard</h1><p class="mt-1 text-sm text-slate-500">Monitoring proses transmittal dokumen.</p></div><div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">${[['Total Pengajuan',d.metrics.total],['Menunggu Approval',d.metrics.pending],['Approved',d.metrics.approved],['Rejected',d.metrics.rejected]].map(x=>`<div class="rounded-2xl border bg-white p-5 shadow-sm"><div class="text-sm text-slate-500">${x[0]}</div><div class="mt-3 text-3xl font-extrabold">${x[1]}</div></div>`).join('')}</div><div class="mt-6 grid gap-5 lg:grid-cols-2"><div class="rounded-2xl border bg-white p-5"><div class="flex justify-between"><b>Pengajuan Saya</b>${state.user.role==='APPLICANT'?'<button onclick="go(\'create\')" class="text-sm font-bold text-brand">+ Baru</button>':''}</div><div class="mt-4 space-y-2">${d.myRequests.slice(0,5).map(r=>row(r)).join('')||empty()}</div></div><div class="rounded-2xl border bg-white p-5"><b>Approval Saya</b><div class="mt-4 space-y-2">${d.myApprovals.slice(0,5).map(r=>`<button onclick="openDetail('${r.documentId}')" class="w-full rounded-xl border p-3 text-left hover:bg-slate-50"><div class="flex justify-between"><div><b>${esc(r.title)}</b><div class="text-xs text-slate-500">${esc(r.submissionNo)} · Step ${r.order}</div></div>${badge(r.status)}</div></button>`).join('')||empty()}</div></div></div>`}
function row(r){return `<button onclick="openDetail('${r.id}')" class="w-full rounded-xl border p-3 text-left hover:bg-slate-50"><div class="flex justify-between gap-3"><div><b>${esc(r.title)}</b><div class="text-xs text-slate-500">${esc(r.submissionNo)}</div></div>${badge(r.status)}</div></button>`}function empty(){return '<div class="py-6 text-center text-sm text-slate-400">Belum ada data.</div>'}
async function requests(){let rows=await api(`/documents?userId=${state.user.id}&role=${state.user.role}`);return `<div class="mb-6 flex items-end justify-between"><div><h1 class="text-2xl font-extrabold">Pengajuan</h1><p class="text-sm text-slate-500">Daftar transmittal dokumen.</p></div>${state.user.role==='APPLICANT'?'<button onclick="go(\'create\')" class="rounded-xl bg-brand px-4 py-2.5 text-sm font-bold text-white">+ Buat Pengajuan</button>':''}</div><div class="overflow-x-auto rounded-2xl border bg-white p-4 shadow-sm"><table class="w-full text-left text-sm"><thead class="border-b text-xs uppercase text-slate-400"><tr><th class="px-3 py-3">Nomor</th><th class="px-3 py-3">Judul</th><th class="px-3 py-3">Pemohon</th><th class="px-3 py-3">Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr class="border-b"><td class="px-3 py-3 font-bold">${r.submissionNo}</td><td class="px-3 py-3">${esc(r.title)}</td><td class="px-3 py-3">${esc(state.users.find(u=>u.id===r.applicantId)?.name||'-')}</td><td class="px-3 py-3">${badge(r.status)}</td><td class="px-3 py-3 text-right"><button onclick="openDetail('${r.id}')" class="rounded-lg border px-3 py-1.5 font-bold">Detail</button></td></tr>`).join('')}</tbody></table>${rows.length?'':empty()}</div>`}
async function approvals(){let d=await api('/dashboard/'+state.user.id);return `<div class="mb-6"><h1 class="text-2xl font-extrabold">Approval Saya</h1><p class="text-sm text-slate-500">Dokumen yang pernah atau sedang menjadi tanggung jawabmu.</p></div><div class="overflow-x-auto rounded-2xl border bg-white p-4 shadow-sm"><table class="w-full text-left text-sm"><thead class="border-b text-xs uppercase text-slate-400"><tr><th class="px-3 py-3">Nomor</th><th class="px-3 py-3">Dokumen</th><th class="px-3 py-3">Pemohon</th><th class="px-3 py-3">Tahap</th><th class="px-3 py-3">Status</th><th></th></tr></thead><tbody>${d.myApprovals.map(r=>`<tr class="border-b"><td class="px-3 py-3 font-bold">${r.submissionNo}</td><td class="px-3 py-3">${esc(r.title)}</td><td class="px-3 py-3">${esc(r.applicantName)}</td><td class="px-3 py-3">${r.order}</td><td class="px-3 py-3">${badge(r.status)}</td><td><button onclick="openDetail('${r.documentId}')" class="rounded-lg border px-3 py-1.5 font-bold">Review</button></td></tr>`).join('')}</tbody></table></div>`}
async function notifications(){let rows=await api('/notifications/'+state.user.id);return `<div class="mb-6"><h1 class="text-2xl font-extrabold">Notifikasi</h1><p class="text-sm text-slate-500">Prototype notifikasi web. WhatsApp/email dapat diintegrasikan kemudian.</p></div><div class="space-y-3">${rows.map(n=>`<div class="rounded-2xl border bg-white p-4 shadow-sm"><b>${esc(n.message)}</b><div class="mt-1 text-xs text-slate-400">${fmt(n.createdAt)} · ${n.type}</div></div>`).join('')||empty()}</div>`}
async function monitoring(){let rows=await api(`/documents?userId=${state.user.id}&role=${state.user.role}`);return `<div class="mb-6"><h1 class="text-2xl font-extrabold">Monitoring</h1><p class="text-sm text-slate-500">Overview pengajuan.</p></div><div class="overflow-x-auto rounded-2xl border bg-white p-4 shadow-sm"><table class="w-full text-left text-sm"><thead class="border-b text-xs uppercase text-slate-400"><tr><th class="px-3 py-3">No</th><th class="px-3 py-3">Dokumen</th><th class="px-3 py-3">Pemohon</th><th class="px-3 py-3">Area</th><th class="px-3 py-3">Status</th><th/></tr></thead><tbody>${rows.map(r=>`<tr class="border-b"><td class="px-3 py-3 font-bold">${r.submissionNo}</td><td class="px-3 py-3">${esc(r.title)}</td><td class="px-3 py-3">${esc(state.users.find(u=>u.id===r.applicantId)?.name||'-')}</td><td class="px-3 py-3">${esc(r.area)}</td><td class="px-3 py-3">${badge(r.status)}</td><td><button onclick="openDetail('${r.id}')" class="rounded-lg border px-3 py-1.5 font-bold">Detail</button></td></tr>`).join('')}</tbody></table></div>`}
async function renderCreate(){let approvers=state.users.filter(u=>u.role==='APPROVER');document.querySelector('#app').innerHTML=layout(`<div class="mb-6"><h1 class="text-2xl font-extrabold">Buat Pengajuan Transmittal</h1><p class="text-sm text-slate-500">Form mengikuti field pada PRD.</p></div><form id="form" class="space-y-5"><div class="rounded-2xl border bg-white p-5"><h2 class="font-bold">Informasi Pengajuan</h2><div class="mt-4 grid gap-4 md:grid-cols-2"><div><label class="mb-1 block text-sm font-bold">Nama Pemohon</label><input class="w-full rounded-xl border bg-slate-50 px-3 py-2.5" value="${esc(state.user.name)}" disabled></div><div><label class="mb-1 block text-sm font-bold">NIK</label><input class="w-full rounded-xl border bg-slate-50 px-3 py-2.5" value="${esc(state.user.nik)}" disabled></div><div><label class="mb-1 block text-sm font-bold">Departemen</label><input name="department" class="w-full rounded-xl border px-3 py-2.5" value="${esc(state.user.department)}"></div><div><label class="mb-1 block text-sm font-bold">Area/Wilayah</label><input name="area" class="w-full rounded-xl border px-3 py-2.5" value="${esc(state.user.area)}"></div><div><label class="mb-1 block text-sm font-bold">Jenis Dokumen</label><select name="documentType" class="w-full rounded-xl border px-3 py-2.5"><option>Transmittal</option><option>Surat</option><option>Memo</option></select></div><div><label class="mb-1 block text-sm font-bold">Judul Dokumen</label><input name="title" required class="w-full rounded-xl border px-3 py-2.5" placeholder="Dokumen ABC"></div><div class="md:col-span-2"><label class="mb-1 block text-sm font-bold">Keperluan/Deskripsi</label><textarea name="description" class="min-h-24 w-full rounded-xl border px-3 py-2.5"></textarea></div></div></div><div class="rounded-2xl border bg-white p-5"><h2 class="font-bold">Upload Dokumen</h2><input required name="file" type="file" accept=".pdf,.doc,.docx" class="mt-4 block w-full rounded-xl border p-3"></div><div class="rounded-2xl border bg-white p-5"><h2 class="font-bold">Daftar Approver — Berurutan</h2><p class="mt-1 text-xs text-slate-500">Klik sesuai urutan approval.</p><div id="approvers" class="mt-4 grid gap-2">${approvers.map(u=>`<button type="button" data-id="${u.id}" onclick="toggleApprover(this)" class="approver w-full rounded-xl border p-4 text-left"><div class="font-bold">${esc(u.name)}</div><div class="text-xs text-slate-500">${esc(u.position)} · ${esc(u.area)}</div></button>`).join('')}</div></div><div class="flex justify-end"><button class="rounded-xl bg-brand px-5 py-3 font-bold text-white">Submit Pengajuan</button></div></form>`);document.querySelector('#form').onsubmit=submitForm}
let selectedApprovers=[];function toggleApprover(el){let id=Number(el.dataset.id);if(selectedApprovers.includes(id))selectedApprovers=selectedApprovers.filter(x=>x!==id);else selectedApprovers.push(id);document.querySelectorAll('.approver').forEach(b=>{let i=selectedApprovers.indexOf(Number(b.dataset.id));b.className='approver w-full rounded-xl border p-4 text-left '+(i>=0?'border-blue-300 bg-blue-50':'');let badge=b.querySelector('.order');if(badge)badge.remove();if(i>=0){let s=document.createElement('span');s.className='order float-right rounded-full bg-brand px-3 py-1 text-xs font-bold text-white';s.textContent=i+1;b.prepend(s)}})}
async function submitForm(e){e.preventDefault();if(!selectedApprovers.length)return alert('Pilih minimal 1 approver.');let fd=new FormData(e.target);fd.append('applicantId',state.user.id);fd.append('approverIds',JSON.stringify(selectedApprovers));try{let d=await api('/documents',{method:'POST',body:fd});selectedApprovers=[];openDetail(d.id)}catch(err){alert(err.message)}}
async function openDetail(id){state.detail=id;state.page='detail';await renderDetail();setupCanvas()}
async function renderDetail(){let d=await api('/documents/'+state.detail);document.querySelector('#app').innerHTML=layout(`<button onclick="go('${state.user.role==='APPROVER'?'approvals':'requests'}')" class="mb-4 font-bold text-brand">← Kembali</button><div class="mb-5 flex flex-col justify-between gap-3 md:flex-row md:items-end"><div><div class="text-xs font-bold uppercase text-slate-400">${d.submissionNo}</div><h1 class="mt-1 text-2xl font-extrabold">${esc(d.title)}</h1><p class="text-sm text-slate-500">${esc(d.documentType)} · ${esc(d.department)} · ${esc(d.area)}</p></div>${badge(d.status)}</div><div class="grid gap-5 xl:grid-cols-[1.25fr_.75fr]"><div class="space-y-5"><div class="rounded-2xl border bg-white p-5"><h2 class="font-bold">Informasi Dokumen</h2><div class="mt-4 grid gap-3 sm:grid-cols-2 text-sm"><div><span class="text-xs text-slate-400">Pemohon</span><div class="font-bold">${esc(state.users.find(u=>u.id===d.applicantId)?.name||'-')}</div></div><div><span class="text-xs text-slate-400">Tanggal</span><div class="font-bold">${fmt(d.submittedAt)}</div></div><div class="sm:col-span-2"><span class="text-xs text-slate-400">Deskripsi</span><div>${esc(d.description)||'-'}</div></div></div><div class="mt-5 flex flex-wrap gap-2"><a target="_blank" href="${d.filePath}" class="rounded-xl border px-4 py-2.5 text-sm font-bold">Lihat / Download Dokumen</a>${d.qrDataUrl?`<a download="${d.submissionNo}-QR.png" href="${d.qrDataUrl}" class="rounded-xl bg-brand px-4 py-2.5 text-sm font-bold text-white">Download QR</a>`:''}</div></div><div class="rounded-2xl border bg-white p-5"><h2 class="font-bold">Approval Chain</h2><div class="mt-5 space-y-4">${d.steps.map((s,i)=>{let u=state.users.find(x=>x.id===s.approverId);return `<div class="relative flex gap-3">${i<d.steps.length-1?'<div class="absolute left-4 top-9 h-full w-px bg-slate-200"></div>':''}<div class="z-10 grid h-8 w-8 shrink-0 place-items-center rounded-full ${s.status==='APPROVED'?'bg-emerald-100 text-emerald-700':s.status==='REJECTED'?'bg-red-100 text-red-700':'bg-slate-100 text-slate-500'}">${s.status==='APPROVED'?'✓':s.status==='REJECTED'?'×':s.order}</div><div class="flex-1 rounded-xl border p-3"><div class="flex justify-between"><div><b>${esc(u?.name)}</b><div class="text-xs text-slate-500">${esc(u?.position)} · ${esc(u?.area)}</div></div>${badge(s.status)}</div>${s.approvedAt?`<div class="mt-2 text-xs text-slate-400">${fmt(s.approvedAt)}</div>`:''}${s.comment?`<div class="mt-2 rounded-lg bg-slate-50 p-2 text-sm"><b>Catatan:</b> ${esc(s.comment)}</div>`:''}${s.signatureData?`<div class="mt-2"><div class="text-xs font-bold text-slate-500">Signature evidence</div><img src="${s.signatureData}" class="mt-1 h-14 max-w-48 object-contain"></div>`:''}</div></div>`}).join('')}</div></div></div><div>${d.status==='APPROVED'?`<div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5"><h2 class="font-bold text-emerald-700">Approval Completed</h2><img src="${d.qrDataUrl}" class="mx-auto mt-4 w-56"><p class="mt-3 text-center text-xs text-slate-600">QR ini dapat dicetak dan ditempel pada dokumen fisik.</p></div>`:approvalBox(d)}</div></div>`)}
function approvalBox(d){let s=d.steps.find(x=>x.approverId===state.user.id&&x.status==='WAITING');if(!s)return `<div class="rounded-2xl border bg-white p-5 text-sm text-slate-500">Belum ada tindakan yang tersedia untuk akun ini pada tahap sekarang.</div>`;let prev=d.steps.filter(x=>x.order<s.order).some(x=>x.status!=='APPROVED');if(prev)return `<div class="rounded-2xl border bg-white p-5 text-sm text-slate-500">Tahap approval sebelumnya belum selesai.</div>`;return `<div class="rounded-2xl border border-blue-200 bg-white p-5"><h2 class="font-bold text-brand">Tindakan Approval — Step ${s.order}</h2><p class="mt-1 text-sm text-slate-500">Silakan review dokumen sebelum approve/reject.</p><label class="mt-5 mb-2 block text-sm font-bold">Tanda Tangan</label><canvas id="sig" width="700" height="190" class="h-40 w-full touch-none rounded-xl border-2 border-dashed bg-slate-50"></canvas><p class="mt-2 text-xs text-slate-400">Signature menjadi evidence signed-off pada prototype.</p><label class="mt-4 mb-2 block text-sm font-bold">Catatan</label><textarea id="comment" class="min-h-24 w-full rounded-xl border px-3 py-2.5" placeholder="Opsional untuk Approve, wajib untuk Reject"></textarea><div class="mt-4 grid grid-cols-2 gap-2"><button onclick="takeAction('${s.id}','REJECT')" class="rounded-xl bg-red-600 px-4 py-2.5 font-bold text-white">Reject</button><button onclick="takeAction('${s.id}','APPROVE')" class="rounded-xl bg-brand px-4 py-2.5 font-bold text-white">Approve</button></div></div>`}
function setupCanvas(){let c=$('#sig');if(!c)return;let ctx=c.getContext('2d'),down=false;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#172033';const p=e=>{let r=c.getBoundingClientRect();return{x:(e.touches?.[0]||e).clientX-r.left,y:(e.touches?.[0]||e).clientY-r.top}};c.onpointerdown=e=>{down=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!down)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()};window.onpointerup=()=>down=false}
async function takeAction(id,action){let sig=$('#sig')?.toDataURL('image/png')||'';let comment=$('#comment')?.value||'';if(action==='APPROVE'&&!sig)return alert('Tanda tangan wajib diisi.');if(action==='REJECT'&&!comment.trim())return alert('Catatan wajib diisi saat Reject.');try{await api('/approvals/'+id+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approverId:state.user.id,action,comment,signatureData:action==='APPROVE'?sig:''})});await renderDetail();setupCanvas();alert(action==='APPROVE'?'Approval berhasil.':'Dokumen ditolak.')}catch(e){alert(e.message)}}
function go(p){state.page=p;state.detail=null;if(p==='create')selectedApprovers=[];render().then(()=>p==='detail'&&setupCanvas())}
function openFromVerify(){ }
const stored=localStorage.demoUser;if(stored)state.user=JSON.parse(stored);init();
</script></body></html>
